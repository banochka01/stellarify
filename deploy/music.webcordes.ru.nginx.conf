limit_req_zone $binary_remote_addr zone=resonance_api:10m rate=20r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name music.webcordes.ru;

    ssl_certificate /etc/letsencrypt/live/music.webcordes.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.webcordes.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    root /opt/resonance/landing;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        limit_req zone=resonance_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location = /downloads/windows {
    alias /opt/resonance/downloads/Resonance-Setup-1.3.0-x64.exe;
        default_type application/vnd.microsoft.portable-executable;
    add_header Content-Disposition 'attachment; filename="Resonance-Setup-1.3.0-x64.exe"' always;
    }

    location = /downloads/windows-portable {
    alias /opt/resonance/downloads/Resonance-windows-x64-1.3.0.zip;
        default_type application/zip;
    add_header Content-Disposition 'attachment; filename="Resonance-windows-x64-1.3.0.zip"' always;
    }

    location = /downloads/android {
    alias /opt/resonance/downloads/Resonance-android-1.3.0-release-debug-signed.apk;
        default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="Resonance-android-1.3.0-release-debug-signed.apk"' always;
    }

    location = /downloads/ios {
    alias /opt/resonance/downloads/Resonance-ios-unsigned-1.3.0.ipa;
        default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="Resonance-ios-unsigned-1.3.0.ipa"' always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name music.webcordes.ru;
    return 301 https://$host$request_uri;
}
