name: app

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: resonance-api:20260829-account-sync-0.3.1
    container_name: resonance-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      PORT: "8787"
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://music.webcordes.ru}
      AUTH_DB_PATH: /data/resonance.sqlite
    ports:
      - "127.0.0.1:8788:8787"
    volumes:
      - ../../data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
