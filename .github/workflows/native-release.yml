name: Native release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "resonance/**"
      - ".github/workflows/native-release.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows · installer and portable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: resonance
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release --dart-define=RESONANCE_API_URL=https://music.webcordes.ru
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./tool/build_windows_installer.ps1 -SkipFlutterBuild
      - name: Package portable bundle
        shell: pwsh
        run: |
          $output = "../artifacts/resonance-${{ steps.version.outputs.value }}/Resonance-windows-x64-${{ steps.version.outputs.value }}.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $output -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-Windows-${{ steps.version.outputs.value }}
          path: artifacts/resonance-${{ steps.version.outputs.value }}/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android · release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resonance
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build APK
        run: flutter build apk --release --dart-define=RESONANCE_API_URL=https://music.webcordes.ru
      - name: Package APK
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk "Resonance-android-${{ steps.version.outputs.value }}-release-debug-signed.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-Android-${{ steps.version.outputs.value }}
          path: resonance/Resonance-android-${{ steps.version.outputs.value }}-release-debug-signed.apk
          if-no-files-found: error
          retention-days: 30
