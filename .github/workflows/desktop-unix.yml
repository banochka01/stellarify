name: Linux and macOS desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "resonance/**"
      - ".github/workflows/desktop-unix.yml"

permissions:
  contents: read

jobs:
  linux:
    name: Linux · tar.gz
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: resonance

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-dev libkeybinder-3.0-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux release
        run: >-
          flutter build linux --release
          --dart-define=RESONANCE_API_URL=https://music.webcordes.ru

      - name: Package tar.gz
        run: |
          ARCHIVE="Resonance-linux-x64-${{ steps.version.outputs.value }}.tar.gz"
          mkdir -p build/dist
          tar -C build/linux/x64/release/bundle -czf "build/dist/$ARCHIVE" .
          cd build/dist
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-Linux-${{ steps.version.outputs.value }}
          path: |
            resonance/build/dist/*.tar.gz
            resonance/build/dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS · unsigned .app (zip)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: resonance

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build macOS release without signing
        run: >-
          flutter build macos --release
          --dart-define=RESONANCE_API_URL=https://music.webcordes.ru

      - name: Package unsigned .app
        run: |
          ARCHIVE="Resonance-macos-unsigned-${{ steps.version.outputs.value }}.zip"
          mkdir -p build/dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/Resonance.app "build/dist/$ARCHIVE"
          cd build/dist
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-macOS-unsigned-${{ steps.version.outputs.value }}
          path: |
            resonance/build/dist/*.zip
            resonance/build/dist/*.sha256
          if-no-files-found: error
          retention-days: 30
