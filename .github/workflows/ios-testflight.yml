name: iOS signed build to TestFlight

# Runs only when ALL signing secrets are configured in the repository:
#   IOS_CERTIFICATE_P12_BASE64   distribution certificate (.p12, base64)
#   IOS_CERTIFICATE_PASSWORD     password of that .p12
#   IOS_PROVISIONING_PROFILE_BASE64  App Store provisioning profile (base64)
#   APPSTORE_API_KEY_ID          App Store Connect API key id
#   APPSTORE_API_ISSUER_ID       App Store Connect issuer id
#   APPSTORE_API_PRIVATE_KEY     contents of AuthKey_<id>.p8
# Optional repository variables:
#   IOS_TEAM_ID                  Apple team id (otherwise read from the profile)
#   RESONANCE_CARPLAY = "1"      enable the CarPlay scene; the profile must carry
#                                the Apple-approved carplay-audio entitlement.
# Without the secrets the build job is skipped (not failed).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROFILE" ] \
             && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS signing secrets are not configured; TestFlight upload skipped."
          fi

  build:
    name: iOS · signed IPA → TestFlight
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: resonance

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Install signing certificate and profile
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          CONFIGURED_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=${CONFIGURED_TEAM_ID:-$TEAM}" >> "$GITHUB_ENV"

      - name: Enable CarPlay (opt-in)
        if: vars.RESONANCE_CARPLAY == '1'
        run: |
          bash ios/CarPlay/enable_carplay.sh
          echo "CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements" >> ios/Flutter/Release.xcconfig

      - name: Configure manual signing (CI checkout only)
        run: |
          {
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = $TEAM_ID"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME"
          } >> ios/Flutter/Release.xcconfig

      - name: Resolve dependencies
        run: flutter pub get

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.resonance.resonance</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --dart-define=RESONANCE_API_URL=https://music.webcordes.ru \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -n1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
