name: Diagnose Resonance VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELEASE_SSH_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          printf '%s\n' '104.128.140.14 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB1dmCvPxjtmb2Z/+fPm97xX5AhFTxBAMiXoZJ0eyNXb' > ~/.ssh/known_hosts

      - name: Inspect release preflight
        run: |
          ssh -i ~/.ssh/release_key root@104.128.140.14 'bash -s' <<'REMOTE'
          set -u
          ROOT=/opt/resonance
          APP=$ROOT/app
          for target in "$APP/.git" "$ROOT/.env" "$ROOT/downloads" "$ROOT/landing"; do
            if test -e "$target"; then
              printf 'exists: %s\n' "$target"
            else
              printf 'missing: %s\n' "$target"
            fi
          done
          printf 'commit: '
          git -C "$APP" rev-parse HEAD || true
          printf 'branch: '
          git -C "$APP" branch --show-current || true
          printf '%s\n' 'working-tree:'
          git -C "$APP" status --short || true
          printf '%s\n' 'disk-kb:'
          df -Pk "$ROOT"
          printf '%s\n' 'docker:'
          docker compose -f "$APP/deploy/docker-compose.music.yml" ps || true
          printf '%s\n' 'root-usage:'
          du -x -h --max-depth=2 "$ROOT" 2>/dev/null | sort -h | tail -30
          printf '%s\n' 'docker-disk:'
          docker system df
          printf '%s\n' 'app-top-level:'
          find "$APP" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          printf '%s\n' 'temporary-payloads:'
          find /tmp -maxdepth 1 -type d -name 'resonance-*' -printf '%f\n' 2>/dev/null | sort
          REMOTE
