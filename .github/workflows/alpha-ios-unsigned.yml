name: Resonance α · iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    paths:
      - "alpha/**"
      - "resonance/lib/**"
      - "resonance/pubspec.*"
      - ".github/workflows/alpha-ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    name: α iOS · unsigned IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: alpha

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Read app version
        id: version
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build without code signing
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=RESONANCE_API_URL=https://music.webcordes.ru

      - name: Package unsigned IPA
        run: |
          NAME="Resonance-alpha-ios-unsigned-${{ steps.version.outputs.value }}"
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry "$NAME.ipa" Payload
          shasum -a 256 "$NAME.ipa" > "$NAME.ipa.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-alpha-iOS-unsigned-${{ steps.version.outputs.value }}
          path: |
            alpha/build/ios/ipa/*.ipa
            alpha/build/ios/ipa/*.ipa.sha256
          if-no-files-found: error
          retention-days: 30
