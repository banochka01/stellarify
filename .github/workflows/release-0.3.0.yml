name: Resonance 0.3.0 production release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.3.0
  API_URL: https://music.webcordes.ru

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows client
        working-directory: resonance
        run: flutter build windows --release --dart-define=RESONANCE_API_URL=${{ env.API_URL }}
      - name: Package Windows client
        shell: pwsh
        run: Compress-Archive -Path resonance/build/windows/x64/runner/Release/* -DestinationPath Resonance-windows-x64-${{ env.RELEASE_VERSION }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-windows
          path: Resonance-windows-x64-${{ env.RELEASE_VERSION }}.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Android client
        working-directory: resonance
        run: flutter build apk --release --dart-define=RESONANCE_API_URL=${{ env.API_URL }}
      - name: Name Android client
        run: mv resonance/build/app/outputs/flutter-apk/app-release.apk Resonance-android-${{ env.RELEASE_VERSION }}-release-debug-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-android
          path: Resonance-android-${{ env.RELEASE_VERSION }}-release-debug-signed.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS client without signing
        working-directory: resonance
        run: flutter build ios --release --no-codesign --dart-define=RESONANCE_API_URL=${{ env.API_URL }}
      - name: Package unsigned IPA
        working-directory: resonance
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry "Resonance-ios-unsigned-${RELEASE_VERSION}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-ios
          path: resonance/build/ios/ipa/Resonance-ios-unsigned-${{ env.RELEASE_VERSION }}.ipa
          if-no-files-found: error

  deploy:
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Build landing and source bundles
        run: |
          npm ci
          npm run build --workspace @resonance/landing
          tar -czf release/landing.tar.gz -C apps/landing/dist .
          git archive --format=tar.gz --output=release/source.tar.gz HEAD
          (cd release && sha256sum Resonance-* > SHA256SUMS.txt)
      - name: Configure temporary SSH transport
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELEASE_SSH_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          printf '%s\n' '104.128.140.14 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB1dmCvPxjtmb2Z/+fPm97xX5AhFTxBAMiXoZJ0eyNXb' > ~/.ssh/known_hosts
      - name: Upload release payload
        run: |
          ssh -i ~/.ssh/release_key root@104.128.140.14 "find /tmp -mindepth 1 -maxdepth 1 -type d -name 'resonance-*' ! -name 'resonance-${GITHUB_SHA}' -exec rm -rf -- {} +; install -d -m 700 /tmp/resonance-${GITHUB_SHA}"
          scp -i ~/.ssh/release_key release/* root@104.128.140.14:/tmp/resonance-${GITHUB_SHA}/
          scp -i ~/.ssh/release_key deploy/music.webcordes.ru.nginx.conf root@104.128.140.14:/tmp/resonance-${GITHUB_SHA}/nginx.conf
      - name: Deploy atomically with rollback
        run: |
          ssh -i ~/.ssh/release_key root@104.128.140.14 "RELEASE_SHA=${GITHUB_SHA} RELEASE_VERSION=${RELEASE_VERSION} bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/resonance
          APP=$ROOT/app
          PAYLOAD=/tmp/resonance-$RELEASE_SHA
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          BACKUP=$ROOT/backups/release-$STAMP
          NGINX_SITE=/etc/nginx/sites-available/music.webcordes.ru
          COMPOSE='docker compose -f deploy/docker-compose.music.yml'
          APP_SWAPPED=0
          HAD_DATA=0

          test -d "$APP"
          test -f "$APP/deploy/docker-compose.music.yml"
          test -f "$ROOT/.env"
          test -d "$ROOT/downloads"
          docker builder prune -af
          AVAILABLE_KB=$(df -Pk "$ROOT" | awk 'NR==2 {print $4}')
          test "$AVAILABLE_KB" -gt 850000

          install -d -m 700 "$BACKUP"
          printf '%s\n' "$RELEASE_SHA" > "$BACKUP/release-attempt"
          cp "$ROOT/.env" "$BACKUP/env"
          cp "$NGINX_SITE" "$BACKUP/nginx.conf"
          tar -czf "$BACKUP/app.tar.gz" -C "$APP" .
          tar -czf "$BACKUP/landing.tar.gz" -C "$ROOT/landing" .
          cp -al "$ROOT/downloads" "$BACKUP/downloads"
          if test -d "$ROOT/data"; then
            HAD_DATA=1
            tar -czf "$BACKUP/data.tar.gz" -C "$ROOT/data" .
          fi

          rollback() {
            trap - ERR
            cd /
            if test "$APP_SWAPPED" -eq 1; then
              rm -rf "$APP"
              mv "$ROOT/app.previous" "$APP"
            else
              rm -rf "$ROOT/app.next"
            fi
            cp "$BACKUP/env" "$ROOT/.env"
            rm -rf "$ROOT/data"
            install -d -m 700 -o 1000 -g 1000 "$ROOT/data"
            if test "$HAD_DATA" -eq 1; then
              tar -xzf "$BACKUP/data.tar.gz" -C "$ROOT/data"
              chown -R 1000:1000 "$ROOT/data"
            fi
            rm -rf "$ROOT/landing.rollback"
            mv "$ROOT/landing" "$ROOT/landing.rollback" || true
            install -d "$ROOT/landing"
            tar -xzf "$BACKUP/landing.tar.gz" -C "$ROOT/landing"
            cp "$BACKUP/nginx.conf" "$NGINX_SITE"
            (cd "$APP" && $COMPOSE up -d --build)
            nginx -t && systemctl reload nginx
            echo "Rollback restored the previous application snapshot from $BACKUP" >&2
          }
          trap rollback ERR

          rm -rf "$ROOT/app.next" "$ROOT/app.previous"
          install -d "$ROOT/app.next"
          tar -xzf "$PAYLOAD/source.tar.gz" -C "$ROOT/app.next"
          test -f "$ROOT/app.next/deploy/docker-compose.music.yml"
          test -f "$ROOT/app.next/apps/server/package.json"
          printf '%s\n' "$RELEASE_SHA" > "$ROOT/app.next/.release-sha"
          mv "$APP" "$ROOT/app.previous"
          mv "$ROOT/app.next" "$APP"
          APP_SWAPPED=1
          install -d -m 700 -o 1000 -g 1000 "$ROOT/data"

          sed -i '/^CLIENT_VERSION=/d;/^CLIENT_RELEASE_NOTES=/d' "$ROOT/.env"
          printf '%s\n' "CLIENT_VERSION=$RELEASE_VERSION" >> "$ROOT/.env"
          printf '%s\n' 'CLIENT_RELEASE_NOTES=Аккаунт Resonance и синхронизация избранного и плейлистов между устройствами.' >> "$ROOT/.env"

          install -m 0644 "$PAYLOAD/Resonance-windows-x64-$RELEASE_VERSION.zip" "$ROOT/downloads/Resonance-windows-x64-$RELEASE_VERSION.zip.new"
          install -m 0644 "$PAYLOAD/Resonance-android-$RELEASE_VERSION-release-debug-signed.apk" "$ROOT/downloads/Resonance-android-$RELEASE_VERSION-release-debug-signed.apk.new"
          install -m 0644 "$PAYLOAD/Resonance-ios-unsigned-$RELEASE_VERSION.ipa" "$ROOT/downloads/Resonance-ios-unsigned-$RELEASE_VERSION.ipa.new"
          mv "$ROOT/downloads/Resonance-windows-x64-$RELEASE_VERSION.zip.new" "$ROOT/downloads/Resonance-windows-x64-$RELEASE_VERSION.zip"
          mv "$ROOT/downloads/Resonance-android-$RELEASE_VERSION-release-debug-signed.apk.new" "$ROOT/downloads/Resonance-android-$RELEASE_VERSION-release-debug-signed.apk"
          mv "$ROOT/downloads/Resonance-ios-unsigned-$RELEASE_VERSION.ipa.new" "$ROOT/downloads/Resonance-ios-unsigned-$RELEASE_VERSION.ipa"

          rm -rf "$ROOT/landing.next"
          install -d "$ROOT/landing.next"
          tar -xzf "$PAYLOAD/landing.tar.gz" -C "$ROOT/landing.next"

          cd "$APP"
          $COMPOSE config >/dev/null
          $COMPOSE up -d --build
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/api/health >/dev/null; then break; fi
            test "$attempt" -lt 30
            sleep 5
          done

          rm -rf "$ROOT/landing.previous"
          mv "$ROOT/landing" "$ROOT/landing.previous"
          mv "$ROOT/landing.next" "$ROOT/landing"
          install -m 0644 "$PAYLOAD/nginx.conf" "$NGINX_SITE"
          nginx -t
          systemctl reload nginx

          curl -fsS https://music.webcordes.ru/api/health
          curl -fsS https://music.webcordes.ru/api/client-version | grep -F '"version":"0.3.0"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://music.webcordes.ru/api/v1/account/me)" = 401

          SMOKE_EMAIL="release-smoke-$STAMP@example.invalid"
          REGISTER_FILE=$(mktemp)
          SYNC_FILE=$(mktemp)
          chmod 600 "$REGISTER_FILE" "$SYNC_FILE"
          curl -fsS -H 'content-type: application/json' \
            -d "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"release smoke password 0.3.0\",\"deviceName\":\"release-smoke\"}" \
            https://music.webcordes.ru/api/v1/account/register > "$REGISTER_FILE"
          ACCESS=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).accessToken)" "$REGISTER_FILE")
          REFRESH=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).refreshToken)" "$REGISTER_FILE")
          OPERATION_ID=$(node -e "process.stdout.write(require('crypto').randomUUID())")
          curl -fsS -H 'content-type: application/json' -H "authorization: Bearer $ACCESS" \
            -d "{\"operations\":[{\"id\":\"$OPERATION_ID\",\"type\":\"favoriteUpsert\",\"track\":{\"id\":\"release-smoke\",\"title\":\"Release smoke\",\"normalizedTitle\":\"release smoke\",\"artist\":\"Resonance\",\"normalizedArtist\":\"resonance\",\"album\":null,\"duration\":1000,\"artworkUrl\":null,\"sources\":[{\"provider\":\"soundcloud\",\"externalId\":\"release-smoke\",\"externalUrl\":\"https://soundcloud.com/example/release-smoke\",\"metadata\":{\"token\":\"must-not-sync\"}}],\"preferredProvider\":\"soundcloud\"}}]}" \
            https://music.webcordes.ru/api/v1/account/library/operations > "$SYNC_FILE"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(x.library.favorites.length!==1||Object.keys(x.library.favorites[0].sources[0].metadata).length!==0)process.exit(1)" "$SYNC_FILE"
          curl -fsS -o /dev/null -H 'content-type: application/json' \
            -d "{\"refreshToken\":\"$REFRESH\"}" \
            https://music.webcordes.ru/api/v1/account/logout
          docker exec -e SMOKE_EMAIL="$SMOKE_EMAIL" resonance-api node --input-type=module -e "import { DatabaseSync } from 'node:sqlite'; const db=new DatabaseSync('/data/resonance.sqlite'); db.prepare('DELETE FROM account_users WHERE email = ?').run(process.env.SMOKE_EMAIL); db.close();"
          rm -f "$REGISTER_FILE" "$SYNC_FILE"

          for target in windows android ios; do
            curl -fsSI "https://music.webcordes.ru/downloads/$target" | grep -E 'HTTP/.* 200|Content-Disposition'
          done
          (cd "$PAYLOAD" && sha256sum -c SHA256SUMS.txt)
          sha256sum \
            "$ROOT/downloads/Resonance-windows-x64-$RELEASE_VERSION.zip" \
            "$ROOT/downloads/Resonance-android-$RELEASE_VERSION-release-debug-signed.apk" \
            "$ROOT/downloads/Resonance-ios-unsigned-$RELEASE_VERSION.ipa"
          test -s "$ROOT/data/resonance.sqlite"
          docker inspect --format '{{json .State.Health}}' resonance-api
          df -h "$ROOT"
          trap - ERR
          rm -rf "$PAYLOAD" "$ROOT/app.previous" "$ROOT/landing.previous"
          echo "Production release complete; backup: $BACKUP"
          REMOTE
