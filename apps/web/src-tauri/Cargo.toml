[package]
name = "stellarify"
version = "0.1.0"
description = "All your music in one space"
authors = ["Stellarify"]
edition = "2021"

[lib]
name = "stellarify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

